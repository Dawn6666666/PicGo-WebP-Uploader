<!doctype html>
<html lang="zh-CN" class="mdui-theme-auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>图片上传 · PicGo Uploader</title>
  <link rel="stylesheet" href="/vendor/mdui/mdui.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="app-bar">
    <div class="bar-inner">
      <div class="brand"><span class="brand-mark"><mdui-icon data-icon="collections"></mdui-icon></span>PicGo Uploader</div>
      <div class="bar-tools">
        <span id="health" class="backend"><mdui-icon data-icon="cloud"></mdui-icon><span>读取图床配置…</span></span>
        <span class="bar-divider" aria-hidden="true"></span>
        <mdui-button-icon id="themeToggleBtn" title="切换到深色模式"><mdui-icon data-icon="moon"></mdui-icon><span class="sr-only" id="themeActionLabel">切换到深色模式</span></mdui-button-icon>
      </div>
    </div>
  </header>

  <main class="workspace">
    <div class="page-title">
      <h1>图片上传</h1>
      <p>先预览压缩结果，再上传单张或整批图片。</p>
    </div>
    <div class="setup">
      <section class="panel source" aria-labelledby="source-title">
        <div class="panel-head">
          <h2 id="source-title">图片来源</h2>
          <div id="sourceMode" role="radiogroup" aria-labelledby="source-title">
            <label for="filesMode"><input id="filesMode" type="radio" name="source" value="files" checked><span>图片文件</span></label>
            <label for="directoryMode"><input id="directoryMode" type="radio" name="source" value="directory"><span>本机目录</span></label>
          </div>
        </div>
        <div id="fileSource" class="source-body">
          <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml,image/avif,image/tiff,.avif,.tif,.tiff" multiple hidden>
          <div id="dropzone" class="dropzone">
            <div id="dropzoneContent" class="drop-content">
              <mdui-icon class="drop-icon" data-icon="add-image"></mdui-icon>
              <strong class="desktop-hint">将图片拖到这里</strong>
              <span class="desktop-hint">也可以直接粘贴剪贴板中的图片</span>
            </div>
            <div id="selection" hidden>
              <div id="thumbnails"></div>
              <strong id="selectionSummary"></strong>
              <p id="selectionNames"></p>
            </div>
            <mdui-button id="chooseFiles" variant="filled"><mdui-icon slot="icon" data-icon="add"></mdui-icon><span>选择图片</span></mdui-button>
          </div>
          <p class="formats">支持 JPG、PNG、WebP、GIF、SVG、AVIF 和 TIFF</p>
        </div>
        <div id="directorySource" class="source-body directory" hidden>
          <label for="localDirectoryPath">本机目录路径</label>
          <input id="localDirectoryPath" type="text" spellcheck="false" autocomplete="off" placeholder="输入图片所在文件夹的完整路径" aria-describedby="directoryHint">
          <p id="directoryHint">服务将递归读取该目录及子目录，适合大批量图片。</p>
        </div>
        <div class="source-actions">
          <span id="sourceStatus"></span>
          <mdui-button id="uploadBtn" variant="filled" disabled><mdui-icon slot="icon" data-icon="compress"></mdui-icon><span>压缩并预览</span></mdui-button>
        </div>
      </section>

      <section class="panel settings" aria-labelledby="settings-title">
        <div class="panel-head"><h2 id="settings-title">压缩设置</h2><mdui-icon class="section-icon" data-icon="tune"></mdui-icon></div>
        <div class="setting-body">
          <div class="field-heading"><label id="qualityTitle" for="quality">WebP 质量</label><output id="qualityLabel" for="quality">82</output></div>
          <input type="range" id="quality" min="1" max="100" step="1" value="82">
          <div class="scale"><span>更小体积</span><span>更高清晰度</span></div>
          <div class="field-block"><label for="dimensionPreset">最长边</label>
            <select id="dimensionPreset"><option value="0">保留原尺寸</option><option value="1280">1280 px</option><option value="1920">1920 px</option><option value="2560">2560 px</option><option value="3840">3840 px</option><option value="custom">自定义尺寸</option></select>
            <label id="customDimension" for="maxDimension" hidden>最长边（px）<input id="maxDimension" type="number" min="1" max="20000" step="1" value="2560" required></label>
          </div>
        </div>
        <details id="advanced" class="advanced">
          <summary><span>高级设置</span><mdui-icon data-icon="expand"></mdui-icon></summary>
          <div class="advanced-fields">
            <label for="qualityPreset">质量预设<select id="qualityPreset"><option value="75">75 · 更小</option><option value="82" selected>82 · 均衡</option><option value="88">88 · 清晰</option><option value="100">100 · 最高质量</option><option value="" disabled>自定义</option></select></label>
            <label for="effort">压缩努力度<select id="effort"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option></select></label>
            <label for="maxWidth">最大宽度（px）<input id="maxWidth" type="number" min="0" max="20000" value="0" step="1" list="widths" required><datalist id="widths"><option value="0"></option><option value="800"></option><option value="1280"></option><option value="1920"></option><option value="2560"></option><option value="3840"></option></datalist></label>
            <label for="compressBatchSize">请求分批<select id="compressBatchSize"><option value="0">不分批</option><option value="10">10 MB</option><option value="25">25 MB</option><option value="50">50 MB</option><option value="100">100 MB</option></select></label>
            <label for="compressConcurrency">压缩并发<input id="compressConcurrency" type="number" min="1" max="64" value="8" step="1" required></label>
            <label for="uploadConcurrency">上传并发<input id="uploadConcurrency" type="number" min="1" max="10" value="5" step="1" required></label>
          </div>
        </details>
      </section>
    </div>

    <section class="panel queue" id="resultsPanel" aria-labelledby="queue-title">
      <div class="panel-head queue-head">
        <div class="queue-title"><h2 id="queue-title" tabindex="-1">处理队列</h2><span id="queueCount">0</span></div>
        <div class="queue-actions" id="queueActions" hidden>
          <mdui-button variant="text" id="clearBtn">清空</mdui-button>
          <mdui-button variant="tonal" id="uploadAllBtn"><mdui-icon slot="icon" data-icon="upload"></mdui-icon><span>上传全部</span></mdui-button>
        </div>
      </div>
      <div class="empty" id="emptyState"><mdui-icon data-icon="layers"></mdui-icon><p>压缩后的图片会显示在这里</p></div>
      <div id="batchProgress" hidden><div id="progressLabel"></div><progress aria-labelledby="progressLabel"></progress></div>
      <p id="batchError" role="alert" hidden></p>
      <div id="results"></div>
      <div id="copyBar" class="copy-bar" hidden>
        <span id="linkSummary"></span>
        <div><label for="copyFormat" class="sr-only">复制格式</label><select id="copyFormat"><option value="markdown">Markdown</option><option value="url">URL</option><option value="bbcode">BBCode</option><option value="html">HTML</option></select>
        <mdui-button variant="outlined" id="copyAllBtn"><mdui-icon slot="icon" data-icon="copy"></mdui-icon>复制全部</mdui-button></div>
      </div>
    </section>
  </main>
  <template id="resultTemplate">
    <article class="result-row">
      <div class="thumb"><mdui-icon data-icon="image"></mdui-icon></div>
      <div class="file-info"><h3></h3><p class="meta"><span class="size"></span><span class="dimensions"></span></p><a class="file-link" target="_blank" rel="noopener noreferrer" hidden></a><p class="file-error" hidden></p>
        <details class="logs" hidden><summary>运行日志</summary><pre></pre></details></div>
      <span class="state"></span>
      <div class="row-actions"><mdui-button class="upload-one" variant="text" hidden>上传</mdui-button>
        <mdui-button-icon class="copy-one" title="复制链接" hidden><mdui-icon data-icon="copy"></mdui-icon><span class="sr-only"></span></mdui-button-icon></div>
    </article>
  </template>
  <div id="liveStatus" class="sr-only" role="status"></div>
  <mdui-snackbar id="notice" placement="bottom" timeout="2400"></mdui-snackbar>
</body>
</html>
